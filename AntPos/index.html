<!DOCTYPE html>
<html class="h-full" lang="en" data-theme-mode="{{ theme_mode or 'light' }}">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover maximum-scale=1.0, user-scalable=no"
    />
    <!-- Brand from antPOS Settings, rendered by www/antPOS.py; the app
         keeps it in sync after load (App.vue). -->
    <title>{{ (brand_name or 'antPOS') | e }}</title>
    <script>
      // Resolve the theme before first paint. The server writes the user's
      // choice into data-theme-mode; "automatic" follows the OS. Outside
      // Frappe (vite dev) the Jinja placeholder is left as-is, so fall back
      // to the last choice stored in this browser.
      (function () {
        var root = document.documentElement
        var mode = root.getAttribute('data-theme-mode') || ''
        if (!/^(light|dark|automatic)$/.test(mode)) {
          try { mode = localStorage.getItem('antpos-theme-mode') || 'light' } catch (e) { mode = 'light' }
          root.setAttribute('data-theme-mode', mode)
        }
        var dark = mode === 'dark' ||
          (mode === 'automatic' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{ (brand_name or 'antPOS') | e }}" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Static file from public/; the build prefixes it with the asset path. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA -->
    <!-- The brand favicon from antPOS Settings, so the tab never shows the
         default icon first. -->
    <link rel="icon" href="{{ ((brand and (brand.favicon or brand.default_icon)) or '/assets/ant_pos/antPOS.png') | e }}" />
    <!-- Brand for the app's first render (stores/settings.js). tojson escapes
         <, > and &, so the data cannot close this tag. -->
    <script type="application/json" id="antpos-brand">{{ (brand or {}) | tojson }}</script>
    <link
      rel="apple-touch-icon"
      href="/assets/ant_pos/manifest/apple-icon-180.png"
    />

  </head>
  <body class="sm:overscroll-y-none no-scrollbar">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
